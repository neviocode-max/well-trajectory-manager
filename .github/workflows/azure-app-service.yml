name: Azure App Service

on:
  workflow_run:
    workflows: ["CI and GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-app-service-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Azure App Service
    if: >-
      ${{ vars.AZURE_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: azure-production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Prepare Windows App Service package
        run: npm run package:azure

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy WTM to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./azure-package

      - name: Deployment summary
        run: |
          echo "### Azure App Service deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`${{ vars.AZURE_WEBAPP_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout
